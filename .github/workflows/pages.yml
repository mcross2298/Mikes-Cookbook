name: Verify & Deploy to GitHub Pages

# Two jobs, deliberately split (audit C-16):
#   verify — every gate, on pull requests AND on main
#   deploy — main only, and only after verify passes
#
# Until this split the whole workflow ran on `push: branches: ["main"]` alone,
# so a pull request got no checks at all: the six gates only fired on the merge
# commit, by which point a failure was already live on the production origin.
# The gates were real, they just ran one step too late to protect anything.
# Deploy still never runs from a PR branch — `if: github.ref == refs/heads/main`
# plus `needs: verify` keeps that property.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PRs cancel their own superseded runs; main never cancels mid-deploy.
  group: "pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JS syntax check (node --check)
        run: |
          fail=0
          for f in $(git ls-files '*.js'); do
            node --check "$f" || { echo "::error file=$f::JavaScript syntax error"; fail=1; }
          done
          exit $fail
      - name: Validate recipes-data.js
        run: node tools/validate-recipes.js
      - name: Docs match the code (counts, sizes, structural claims — audit C-11)
        run: node tools/check-docs.js
      - name: Cross-app bridge regression tests (mc-bridge.js read layer + mc-sync.js merge logic)
        run: |
          node tools/test-mc-bridge.js
          node tools/test-mc-sync-merge.js
      - name: Kitchen timer store test (mc-timers.js — CI initiative 1)
        run: node tools/test-mc-timers.js
      - name: Split data layer test (build-data.js output + mc-data.js hydration — CI initiative 5)
        run: node tools/test-mc-data.js
      - name: Generated recipe index + shards are current (build-data.js --check)
        run: node tools/build-data.js --check
      - name: Ingredient unit/density/aisle model + fragmentation ratchet (mc-units.js — CI initiative 2)
        run: node tools/test-mc-units.js
      - name: Search ranking + performance regression tests (mc-search.js — CI initiative 4)
        run: node tools/test-mc-search.js
      - name: Service-worker strategy test (stale-while-revalidate — audit LS-4)
        run: node tools/test-sw-strategy.js
      - name: Backup format test (mc-export.js round trip + legacy files — audit C-01)
        run: node tools/test-mc-export.js
      - name: UI smoke test (Playwright, real browser — tools/smoke-test.js)
        # Opens a page and clicks something — everything else reasons about
        # source text or runs a module in a vm sandbox. Playwright is
        # installed ad hoc for this one step only (no committed
        # package.json/lockfile — the checkout is discarded when the job
        # ends, so this never changes the repo's real npm-free footprint).
        # Same ad-hoc pattern Cross-Household-'s CI uses for its own
        # Playwright-driven tests.
        run: |
          npm init -y
          npm install --no-save playwright@^1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 &
          sleep 1
          node tools/smoke-test.js
          # `npm init` leaves package.json (and npm may leave package-lock.json)
          # sitting in the working tree for the rest of THIS job's steps, even
          # though nothing here is ever committed. build-sw.py's precache scan
          # globs top-level *.json among other extensions, so an uncleaned
          # package.json reads as a new, unprecached asset and fails the very
          # next gate — caught for real on 2026-08-02 (PR #132's first run).
          rm -rf node_modules package.json package-lock.json
      - name: Kitchen ergonomics gate (touch-target ratchet — tools/check-a11y.mjs)
        # VOC/VOA Kaizen audit wave 8 (initiative C-I1) — the cookbook's
        # first accessibility gate, ported from Cross-Household-'s own
        # check-a11y.mjs but scoped to touch targets only (see the script's
        # header comment for why contrast isn't in this one yet). It's a
        # ratchet, not zero-tolerance: the fleet-wide audit found real
        # under-floor controls well beyond wave 6's Cooking Mode/card-control
        # fixes, so KNOWN_FAILURES records today's count and this only fails
        # on a NEW regression, same shape as tools/test-mc-units.js's
        # fragmentation ratchet. Its own npm install, separate from the step
        # above — that one already cleaned up after itself before this runs.
        run: |
          npm init -y
          npm install --no-save playwright@^1
          npx playwright install --with-deps chromium
          node tools/check-a11y.mjs
          rm -rf node_modules package.json package-lock.json
      - name: Service-worker precache list is current (build-sw.py --check)
        # The deploy job regenerates sw.js anyway, so this never blocked a
        # deploy — but on a PR it's the only signal that a newly added or
        # renamed top-level asset was never wired into the precache list.
        run: python3 tools/build-sw.py --check
      - name: Shared-module drift check (this repo's copies vs 4-Weeks-to-Open- canonical — audit LS-1)
        # Downloads the canonical shared modules (and the checker itself) from
        # the workout repo and fails if any local copy drifted. Never hand-edit
        # the tracker-*.js / mc-bridge.js / mc-install.js / mc-backup-status.js
        # copies here — fix upstream and re-run tools/sync-shared-modules.py.
        run: |
          mkdir -p /tmp/canonical/tools
          base="https://raw.githubusercontent.com/mcross2298/4-Weeks-to-Open-/main"
          for f in mc-foodapi.js mc-macrocalc.js mc-barcode.js \
                   mc-bridge.js mc-install.js mc-backup-status.js \
                   tools/test-mc-bridge.js tools/sync-shared-modules.py; do
            curl -fsSL --retry 3 "$base/$f" -o "/tmp/canonical/$f"
          done
          python3 /tmp/canonical/tools/sync-shared-modules.py --check --root /tmp/canonical --cookbook-dir .

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Regenerate service worker (auto version + precache list)
        run: python3 tools/build-sw.py --version "ci-${{ github.run_number }}"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
